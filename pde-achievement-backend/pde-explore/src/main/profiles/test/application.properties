# Server Configuration
server.port=8081

# SSO OIDC - test ??
# 本地联调关闭 SSO，使用 mock_mis/X-Mock-Mis 注入用户
mdp.sso.enabled=false
mdp.sso.client-id=c3c790521e
mdp.sso.secret=$KMS{sso.secret}
mdp.sso.paths=/ulivepde/api/**
mdp.sso.register-default-listener=false
mdp.sso.front-end-hosts=pdecamp.adp.test.sankuai.com,yanligame-sl-pdecamp.adp.test.sankuai.com

# Zebra ?????
mdp.zebra[0].jdbcRef=ulivepde_ulivepdeweb_test
mdp.zebra[0].basePackage=com.meituan.pde.dao
mdp.zebra[0].mapperLocations=classpath:mapper/*.xml
mdp.zebra[0].transactionName=pdeTransaction
mdp.zebra[0].datasourceLazyInit=false
mdp.zebra[0].minPoolSize=5
mdp.zebra[0].maxPoolSize=20
mdp.zebra[0].initialPoolSize=5
mdp.zebra[0].extraJdbcUrlParams=connectTimeout=5000&socketTimeout=60000&allowMultiQueries=true&zeroDateTimeBehavior=convertToNull

# Org ????????
org.app-key=582cd5719c

# CORS ???????
cors.allowed-origins=*

# MyBatis Configuration
mybatis.type-aliases-package=com.meituan.pde.entity

# Logging Configuration
logging.level.com.meituan.pde=DEBUG
logging.level.org.springframework.web=INFO

# 本地联调可关闭 Pigeon 服务注册，避免内网依赖导致启动阻塞
pde.pigeon.enabled=false

# 本地联调关闭组织信息远程查询，避免接口被 OpenSDK 超时拖慢
pde.sso.remote.enabled=false
