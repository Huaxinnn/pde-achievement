version: v1
common:
build:
  os: centos7
  tools:
    mt_oraclejdk: 8
    maven: 3.9.5
  run:
    workDir: ./
    cmd:
    - sh deploy/compile.sh
  target:
    distDir: ./target/
    files:
    - ./*.jar
    - ./deploy
autodeploy:
  tools:
    mt_oraclejdk: 8
  hulkos: centos7
  targetDir: /opt/meituan/com.sankuai.ulivepde.aicoding.explore/
  env:
  run: sh deploy/run.sh
  check: sh deploy/check.sh
  checkRetry: 3
  CheckInterval: 20s
